<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="static/styles/base.css">
    <link rel="stylesheet" href="static/styles/create_order.css">
    <link rel="apple-touch-icon" sizes="180x180" href="static/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="static/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="static/images/favicon/site.webmanifest">
    <title>Cart - FurBox</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="sticky-top">
        <nav class="navbar navbar-expand-md navbar-dark py-1">
            <div class="container-lg px-3">
                <a class="navbar-brand" href="index.html">FurBox</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="catalog.html">Catalog</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="profile.html">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="cart.html">Cart</a>
                        </li>
                    </ul>
                    <form class="d-flex my-2 my-md-0" role="search">
                        <input class="form-control me-2 input" type="search" placeholder="Search..."
                            aria-label="Search">
                        <button class="btn btn-outline-primary" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-grow-1 py-3">
        <div class="container-lg">
            <section class="cart">
                <h2>Cart</h2>
                <hr>
                <div id="cart-items">
                    <div class="card mb-3">
                        <div class="card-header">
                            <a href="#" class="item-link">
                                <h5 class="card-title">Fursuit Husky Fox Mascot</h5>
                            </a>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col">
                                    <div class="input-group">
                                        <button type="button" class="btn btn-outline-primary decrement" data-cart-id=""
                                            data-cart-change-url="">-</button>
                                        <input type="text" class="form-control input card-input number" value="1"
                                            readonly>
                                        <button type="button" class="btn btn-outline-primary increment" data-cart-id=""
                                            data-cart-change-url="">+</button>
                                    </div>
                                </div>
                                <div class="col">
                                    <p class="h-100 align-content-center">x <strong>$347</strong> = </p>
                                </div>
                                <div class="col">
                                    <p class="h-100 align-content-center"><strong>$347</strong></p>
                                </div>
                                <div class="col">
                                    <p class="h-100 align-content-center">
                                        <a href="#" class="remove-from-cart" data-cart-id="" data-bs-toggle="tooltip"
                                            data-bs-placement="bottom" data-bs-custom-class="custom-tooltip"
                                            data-bs-title="Remove from cart">
                                            <img class="mx-1" src="static/images/cart/trash-fill.svg" alt="Catalog Icon"
                                                width="16" height="16">
                                        </a>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-footer">
                            <p>Total:</p>
                            <p><strong>$347</strong></p>
                        </div>
                    </div>
                </div>
            </section>
            <section class="order-details">
                <h2>Order details</h2>
                <hr>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input type="text" class="form-control input" id="firstName"
                                placeholder="Input your first name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control input" id="lastName"
                                placeholder="Input your last name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control input" id="phone" placeholder="Input your phone"
                                required>
                        </div>
                        <div class="col-md-12">
                            <label for="delivery" class="form-label me-3">Delivery mothod: </label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input radio" type="radio" name="requires_delivery"
                                    id="requires_delivery" value="1" checked>
                                <label class="form-check-label" for="requires_delivery">Delivery</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input radio" type="radio" name="requires_delivery"
                                    id="requires_delivery_false" value="0">
                                <label class="form-check-label" for="requires_delivery_false">Self-pickup</label>
                            </div>
                        </div>
                        <div class="mb-3" id="deliveryAddressField">
                            <label for="delivery_address" class="form-label">Delivery address</label>
                            <textarea class="form-control text-area" id="delivery_address" name="delivery_address"
                                rows="2" placeholder="Input your address"></textarea>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label me-3">Paymant method: </label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input radio" type="radio" name="payment_on_get" id="id_payment_on_get_false"
                                value="0" checked>
                            <label class="form-check-label" for="id_payment_on_get_false">Card online</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input radio" type="radio" name="payment_on_get" id="id_payment_on_get"
                                value="1">
                            <label class="form-check-label" for="id_payment_on_get">Upon receipt</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-outline-primary mt-3">Place an order</button>
                </form>
            </section>
        </div>
    </main>
    <footer>
        <div class="container-lg px-3 py-2 text-center">
            <div class="row align-items-center">
                <div class="col-12 col-md-4">
                    <ul class="footer-list">
                        <li>
                            <a href="#" class="footer-link">
                                News
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                About us
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                Contacts
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="col-12 col-md-4">
                    <ul class="footer-list">
                        <li>
                            <a href="#" class="footer-link">Delivery and Payment</a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">Warranty and Service</a>
                        </li>
                    </ul>
                </div>
                <div class="col-12 col-md-4">
                    <ul class="footer-list d-flex justify-content-center">
                        <li>
                            <a href="#" class="footer-link">
                                <img src="static/images/footer_links/telegram.svg" alt="Telegram"
                                    class="footer-link-img">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                <img src="static/images/footer_links/instagram.svg" alt="Instagram"
                                    class="footer-link-img">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                <img src="static/images/footer_links/youtube.svg" alt="YouTube" class="footer-link-img">
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-4.0.0.slim.min.js"
        integrity="sha256-8DGpv13HIm+5iDNWw1XqxgFB4mj+yOKFNb+tHBZOowc=" crossorigin="anonymous"></script>

    <script>
        const header = document.querySelector('header');

        const observer = new ResizeObserver(entries => {
            const height = entries[0].borderBoxSize[0].blockSize;

            document.documentElement.style.setProperty(
                '--header-height',
                `calc(${height}px + 1rem)`
            );
        });

        observer.observe(header);
    </script>

    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
    </script>

    <script>
        $(document).ready(function () {
            $("input[name='requires_delivery']").change(function () {
                var selectedValue = $(this).val();
                if (selectedValue === "1") {
                    $("#deliveryAddressField").show();
                } else {
                    $("#deliveryAddressField").hide();
                }
            });

        });
    </script>
</body>

</html>
