<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="static/styles/base.css">
    <link rel="stylesheet" href="static/styles/registration.css">
    <link rel="apple-touch-icon" sizes="180x180" href="static/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="static/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="static/images/favicon/site.webmanifest">
    <title>Catalog - FurBox</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="sticky-top">
        <nav class="navbar navbar-expand-md navbar-dark py-1">
            <div class="container-lg px-3">
                <a class="navbar-brand" href="index.html">FurBox</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="catalog.html">Catalog</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Cart</a>
                        </li>
                    </ul>
                    <form class="d-flex my-2 my-md-0" role="search">
                        <input class="form-control me-2 input" type="search" placeholder="Search..."
                            aria-label="Search">
                        <button class="btn btn-outline-primary search-button" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-grow-1 py-3">
        <div class="container-lg">
            <section class="registration">
                <h2 class="text-center">Registration</h2>
                <hr>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input type="text" class="form-control input" id="firstName" placeholder="Input your first name"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control input" id="lastName" placeholder="Input your last name"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control input" id="username"
                                placeholder="Input your username" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control input" id="email" placeholder="Input your email"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="password1" class="form-label">Password</label>
                            <input type="password" class="form-control input" id="password1" placeholder="Input your password"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="password2" class="form-label">Repeat password</label>
                            <input type="password" class="form-control input" id="password2" placeholder="Repeat your password"
                                required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-outline-primary mt-3">Create account</button>
                </form>
            </section>
        </div>
    </main>
    <footer>
        <div class="container-lg px-3 py-2 text-center">
            <div class="row align-items-center">
                <div class="col-12 col-md-4">
                    <ul class="footer-list">
                        <li>
                            <a href="#" class="footer-link">
                                News
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                About us
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                Contacts
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="col-12 col-md-4">
                    <ul class="footer-list">
                        <li>
                            <a href="#" class="footer-link">Delivery and Payment</a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">Warranty and Service</a>
                        </li>
                    </ul>
                </div>
                <div class="col-12 col-md-4">
                    <ul class="footer-list d-flex justify-content-center">
                        <li>
                            <a href="#" class="footer-link">
                                <img src="static/images/footer_links/telegram.svg" alt="Telegram"
                                    class="footer-link-img">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                <img src="static/images/footer_links/instagram.svg" alt="Instagram"
                                    class="footer-link-img">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="footer-link">
                                <img src="static/images/footer_links/youtube.svg" alt="YouTube" class="footer-link-img">
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const header = document.querySelector('header');

        const observer = new ResizeObserver(entries => {
            const height = entries[0].borderBoxSize[0].blockSize;

            document.documentElement.style.setProperty(
                '--header-height',
                `calc(${height}px + 1rem)`
            );
        });

        observer.observe(header);
    </script>

    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
    </script>
</body>

</html>
